name: Build Minimal Shell APK

on:
  push:
    branches:
      - build/minimal-shell-preview
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk MinimalShell-0.1.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MinimalShell-0.1.0-debug
          path: MinimalShell-0.1.0-debug.apk
          if-no-files-found: error
